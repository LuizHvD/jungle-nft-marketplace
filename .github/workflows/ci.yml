name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Atualizar baselines visuais no Ubuntu
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Testes unitários
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: Playwright no dev e no preview
        run: pnpm test:e2e

      - name: Relatório HTML do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Fontes estáveis do baseline
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fontconfig

      - name: Instalar Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Baselines visuais
        env:
          VISUAL_LINUX: '1'
          FONTCONFIG_FILE: ${{ github.workspace }}/e2e/linux-fonts.conf
        run: |
          flags=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.update_snapshots }}" = "true" ]; then
            flags="--update-snapshots"
          elif [ ! -d e2e/visual.spec.ts-snapshots ] || [ -z "$(ls -A e2e/visual.spec.ts-snapshots 2>/dev/null)" ]; then
            flags="--update-snapshots"
          fi
          pnpm exec playwright test e2e/visual.spec.ts --project=preview $flags

      - name: Relatório visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: playwright-report
          retention-days: 7

      - name: Snapshots visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: e2e/visual.spec.ts-snapshots
          if-no-files-found: ignore
          retention-days: 7
